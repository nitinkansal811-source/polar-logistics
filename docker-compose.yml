version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: polar_postgis
    environment:
      POSTGRES_USER: polar
      POSTGRES_PASSWORD: polarlogistics
      POSTGRES_DB: polar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polar -d polar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polar_backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://polar:polarlogistics@db:5432/polar_db
      JWT_SECRET: polar_expedition_secret_key_2026_ncpor
      CLIENT_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polar_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
